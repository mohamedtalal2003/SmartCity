syntax = "proto3";
package smartcity.enums.v1;

// ─────────────────────────────────────────────────────────────
// Shared domain enums. Kept in one file so queries and commands
// reference the same definitions.
// ─────────────────────────────────────────────────────────────

// ─── Road damage (Pothole service) ───────────────────────────
// Progressive stages of road surface deterioration.
enum DamageStage {
  DAMAGE_STAGE_UNSPECIFIED = 0;
  DAMAGE_STAGE_RAVELING = 1;            // Yüzey Oksidasyonu / Aşınma
  DAMAGE_STAGE_TRANSVERSE_CRACKING = 2; // Boyuna / Enine Çatlak
  DAMAGE_STAGE_BLOCK_CRACKING = 3;      // Blok Çatlama
  DAMAGE_STAGE_FATIGUE_CRACKING = 4;    // Yorgunluk Çatlağı
  DAMAGE_STAGE_RUTTING = 5;             // Tekerlek İzi / Ötelenme
  DAMAGE_STAGE_DEPRESSION = 6;          // Yerel Çökme / Su Birikintisi
  DAMAGE_STAGE_POTHOLE = 7;             // Çukur Oluşumu
}

// Pothole state. Closed is final.
enum PotholeStatus {
  POTHOLE_STATUS_UNSPECIFIED = 0;
  POTHOLE_STATUS_OPEN = 1;
  POTHOLE_STATUS_CLOSED = 2;
}

// Why a pothole was closed.
enum ClosedReason {
  CLOSED_REASON_UNSPECIFIED = 0;
  CLOSED_REASON_REPAIRED = 1;           // the ticket was completed
  CLOSED_REASON_FALSE_POSITIVE = 2;     // the AI was wrong (starts the 30-day rule)
  CLOSED_REASON_DUPLICATE = 3;          // the same pothole as duplicate_of_id
  CLOSED_REASON_RESOLVED_OTHERWISE = 4; // e.g. the whole street was repaved
}

// Sort order for pothole lists.
enum DamageSort {
  DAMAGE_SORT_UNSPECIFIED = 0;          // server default (newest first)
  DAMAGE_SORT_NEWEST = 1;               // newest first seen
  DAMAGE_SORT_MOST_SEVERE = 2;          // highest severity first
  DAMAGE_SORT_MOST_EXPENSIVE = 3;       // highest estimated cost first
  DAMAGE_SORT_OLDEST_UNREPAIRED = 4;    // open the longest first
}

// Who reported a pothole first.
enum PotholeSource {
  POTHOLE_SOURCE_UNSPECIFIED = 0;
  POTHOLE_SOURCE_AI = 1;                // vehicle camera + cloud AI
  POTHOLE_SOURCE_OFFICER = 2;           // added by an officer
  POTHOLE_SOURCE_CITIZEN_REPORT = 3;    // added by an officer from a citizen report
}

// Why PotholeSaved was published (the event is bus-only; mirrored here for the enum rule).
enum PotholeSavedReason {
  POTHOLE_SAVED_REASON_UNSPECIFIED = 0;
  POTHOLE_SAVED_REASON_NEW = 1;
  POTHOLE_SAVED_REASON_CHANGED = 2;
  POTHOLE_SAVED_REASON_CORRECTED = 3;
}

// ─── Urban inventory (Inventory service) ─────────────────────
enum AssetCategory {
  ASSET_CATEGORY_UNSPECIFIED = 0;
  ASSET_CATEGORY_TRAFFIC_SIGN = 1;      // Trafik ve yön levhaları
  ASSET_CATEGORY_LIGHTING = 2;          // Işıklandırma
  ASSET_CATEGORY_SAFETY_ELEMENT = 3;    // Yol güvenlik elemanları
  ASSET_CATEGORY_URBAN_FURNITURE = 4;   // Kent mobilyası
  ASSET_CATEGORY_PEDESTRIAN_INFRA = 5;  // Yaya / bisiklet altyapısı
}

enum AssetCondition {
  ASSET_CONDITION_UNSPECIFIED = 0;
  ASSET_CONDITION_INTACT = 1;           // Sağlam
  ASSET_CONDITION_FADED = 2;            // Aşınmış / Solmuş
  ASSET_CONDITION_GRAFFITI = 3;         // Graffiti / Kirletilmiş
  ASSET_CONDITION_BROKEN = 4;           // Kırık / Hasarlı
  ASSET_CONDITION_MISSING = 5;          // Eksik / Devrilmiş
}

// ─── Violation service ───────────────────────────────────────
enum ViolationType {
  VIOLATION_TYPE_UNSPECIFIED = 0;
  VIOLATION_TYPE_UNAUTHORIZED = 1;      // No permit on record
  VIOLATION_TYPE_OVERSIZED = 2;         // Exceeds permitted dimensions
  VIOLATION_TYPE_ILLEGAL_PLACEMENT = 3; // Wrong/restricted location
  VIOLATION_TYPE_EXPIRED_PERMIT = 4;    // Permit lapsed
}

// ─── Building service ────────────────────────────────────────
enum AnomalyType {
  ANOMALY_TYPE_UNSPECIFIED = 0;
  ANOMALY_TYPE_MISSING_BARRIER = 1;     // No safety barrier on site
  ANOMALY_TYPE_ILLEGAL_EXTENSION = 2;   // Unpermitted structure
  ANOMALY_TYPE_SCAFFOLDING = 3;         // Scaffolding anomaly / hazard
  ANOMALY_TYPE_DEBRIS = 4;              // Debris / obstruction on public way
}

// ─── Cross-cutting ───────────────────────────────────────────
// Which kind of detection a work order / cost estimate refers to.
enum SourceEntityType {
  SOURCE_ENTITY_TYPE_UNSPECIFIED = 0;
  SOURCE_ENTITY_TYPE_ROAD_DAMAGE = 1;
  SOURCE_ENTITY_TYPE_ASSET_DAMAGE = 2;
  SOURCE_ENTITY_TYPE_VIOLATION = 3;
  SOURCE_ENTITY_TYPE_BUILDING_ANOMALY = 4;
}

// What the cloud AI detected. Numeric ranges route the detection:
// 100s → Pothole, 200s → Inventory, 300s → Violation, 400s → Building.
// (Existed in C# only; added here so both stay the same.)
enum DetectionType {
  DETECTION_TYPE_UNSPECIFIED = 0;
  DETECTION_TYPE_POTHOLE = 100;
  DETECTION_TYPE_ROAD_CRACK = 101;
  DETECTION_TYPE_SURFACE_DAMAGE = 102;
  DETECTION_TYPE_TRAFFIC_LIGHT = 200;
  DETECTION_TYPE_TRAFFIC_SIGN = 201;
  DETECTION_TYPE_STREET_LIGHT = 202;
  DETECTION_TYPE_BARRIER = 203;
  DETECTION_TYPE_STREET_FURNITURE = 204;
  DETECTION_TYPE_COMMERCIAL_SIGN = 300;
  DETECTION_TYPE_BANNER = 301;
  DETECTION_TYPE_BILLBOARD = 302;
  DETECTION_TYPE_SCAFFOLDING = 400;
  DETECTION_TYPE_CONSTRUCTION_SITE = 401;
  DETECTION_TYPE_BUILDING_FACADE = 402;
}

// How bad a detected problem is. (Existed in C# only; added here so both stay the same.)
enum SeverityLevel {
  SEVERITY_LEVEL_UNSPECIFIED = 0;
  SEVERITY_LEVEL_LOW = 1;
  SEVERITY_LEVEL_MEDIUM = 2;
  SEVERITY_LEVEL_HIGH = 3;
  SEVERITY_LEVEL_CRITICAL = 4;
}

// Priority shared by work orders and suggested by cost calc.
enum PriorityLevel {
  PRIORITY_LEVEL_UNSPECIFIED = 0;
  PRIORITY_LEVEL_CRITICAL = 1;
  PRIORITY_LEVEL_HIGH = 2;
  PRIORITY_LEVEL_MEDIUM = 3;
  PRIORITY_LEVEL_ROUTINE = 4;
}

// Work order lifecycle.
// Main path: PENDING → ASSIGNED → EN_ROUTE → ON_SITE → COMPLETED.
// PAUSED can interrupt ON_SITE and resume back to it.
enum WorkOrderStatus {
  WORK_ORDER_STATUS_UNSPECIFIED = 0;
  WORK_ORDER_STATUS_PENDING = 1;        // created, not yet assigned
  WORK_ORDER_STATUS_ASSIGNED = 2;       // crew assigned, not yet moving
  WORK_ORDER_STATUS_IN_PROGRESS = 3;    // (legacy generic "working" state)
  WORK_ORDER_STATUS_AWAITING_REVIEW = 4;// proof submitted, awaiting sign-off (optional)
  WORK_ORDER_STATUS_COMPLETED = 5;      // crew submitted completion; ticket closed
  WORK_ORDER_STATUS_REJECTED = 6;       // resolution rejected, back to crew
  WORK_ORDER_STATUS_EN_ROUTE = 7;       // crew traveling to site
  WORK_ORDER_STATUS_ON_SITE = 8;        // crew arrived and working
  WORK_ORDER_STATUS_PAUSED = 9;         // work paused (materials, weather, etc.)
  WORK_ORDER_STATUS_CANCELLED = 10;     // closed without a repair; see CancelReason
}

// Why a ticket was cancelled. The source item closes with this reason.
enum CancelReason {
  CANCEL_REASON_UNSPECIFIED = 0;
  CANCEL_REASON_FALSE_POSITIVE = 1;     // the AI was wrong; nothing is there
  CANCEL_REASON_DUPLICATE = 2;          // the same item already has a ticket
  CANCEL_REASON_RESOLVED_OTHERWISE = 3; // fixed another way, e.g. street repaved
}

// What the AI saw at a place that waits for repair confirmation.
enum VerificationResult {
  VERIFICATION_RESULT_UNSPECIFIED = 0;
  VERIFICATION_RESULT_GONE = 1;         // the repair looks done
  VERIFICATION_RESULT_STILL_THERE = 2;  // the damage is still there
  VERIFICATION_RESULT_NOT_VISIBLE = 3;  // could not tell; changes nothing
}

// Reason a crew paused work — kept coarse on purpose.
enum PauseReason {
  PAUSE_REASON_UNSPECIFIED = 0;
  PAUSE_REASON_OUT_OF_MATERIALS = 1;
  PAUSE_REASON_WEATHER = 2;
  PAUSE_REASON_EQUIPMENT_FAILURE = 3;
  PAUSE_REASON_SITE_INACCESSIBLE = 4;
  PAUSE_REASON_OTHER = 5;
}

// District was removed: Istanbul has 39 districts and 964 neighborhoods, too many for an enum.
// Messages now carry district_id / district_name / neighborhood_id / neighborhood_name instead.
