# SmartCity — local infrastructure for the walking skeleton.
# Start:  docker compose up -d      Check:  docker compose ps   (all should be "healthy")
# The .NET services run on the host with `dotnet run` during development (see CLAUDE.md).
# A later milestone adds Dockerfiles and an "apps" profile here.

name: smartcity

services:

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-smartcity}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-smartcity}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI  http://localhost:15672
    volumes: [rabbitdata:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 20

  emqx:
    image: emqx/emqx:5.8.6
    # DEV ONLY: anonymous connections allowed. mTLS + per-device ACLs come later (design record §6).
    ports:
      - "1883:1883"     # MQTT
      - "18083:18083"   # dashboard  http://localhost:18083  (admin / public)
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      retries: 20

  s3:
    # Local S3-compatible blob storage: SeaweedFS (replaces MinIO, whose images were removed
    # from Docker Hub in Sept 2026). Services use AWSSDK.S3, so production can point at AWS S3
    # with only a config change.
    # TIP: after the first successful pull, pin the version you got instead of :latest
    #      (docker image inspect chrislusf/seaweedfs --format '{{.RepoDigests}}').
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "9000:8333"     # S3 API on localhost:9000 (same address the old MinIO setup used)
    volumes:
      - s3data:/data
      - ./infra/s3/s3.json:/etc/seaweedfs/s3.json:ro
    # DEV ONLY: S3 identities in infra/s3/s3.json allow signed requests (dev/dev) and
    # anonymous reads so image URLs open directly in the browser.
    # SKELETON: real version uses real credentials from a secrets manager; no anonymous access in production.
    # Buckets are created by the s3-init container below.
    healthcheck:
      # 127.0.0.1, not localhost: in the container localhost resolves to ::1 first, and the
      # SeaweedFS S3 gateway listens on IPv4 only, so a localhost probe is always refused.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/ || exit 1"]
      interval: 10s
      retries: 30

  s3-init:
    # One-shot: creates frames-temp (30-day expiry), frames-permanent and evidence, then exits 0.
    image: chrislusf/seaweedfs:latest
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    volumes:
      - ./infra/s3/init-buckets.sh:/init-buckets.sh:ro
    restart: "no"

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  seq:
    # Central structured logs. Follow one trace with the query:  CorrelationId = '<frame id>'
    image: datalust/seq:2024.3
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:5341"     # ingestion
      - "8081:80"       # UI  http://localhost:8081
    volumes: [seqdata:/data]

  # ─── Application services (docker compose --profile apps up -d --build) ───

  gateway:
    build:
      context: .
      dockerfile: src/Gateway/SmartCity.ApiGateway/Dockerfile
      network: host
    profiles: ["apps"]
    ports:
      - "5000:5000"
    environment:
      Ports__Http: "5000"
      GrpcServices__Pothole: "http://pothole:5231"
      GrpcServices__CostCalculation: "http://costcalculation:5271"
      GrpcServices__WorkOrder: "http://workorder:5281"
      GrpcServices__Notification: "http://notification:5291"
      Redis__ConnectionString: "redis:6379"
      Seq__ServerUrl: "http://seq:5341"
    depends_on:
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }

  vehiclecommunication:
    build:
      context: .
      dockerfile: src/Services/VehicleCommunication/SmartCity.VehicleCommunication/Dockerfile
      network: host
    profiles: ["apps"]
    ports:
      - "5210:5210"
    environment:
      Ports__Http: "5210"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USER:-smartcity}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD:-smartcity}"
      Mqtt__Host: "emqx"
      S3__ServiceUrl: "http://s3:8333"
      S3__ForcePathStyle: "true"
      S3__Region: "us-east-1"
      S3__AccessKey: "dev"
      S3__SecretKey: "dev"
      S3__PublicBaseUrl: "http://localhost:9000"
      Redis__ConnectionString: "redis:6379"
      Seq__ServerUrl: "http://seq:5341"
    depends_on:
      rabbitmq: { condition: service_healthy }
      emqx: { condition: service_healthy }
      s3: { condition: service_healthy }
      redis: { condition: service_healthy }

  aidetection:
    build:
      context: .
      dockerfile: src/Services/AiDetection/SmartCity.AiDetection/Dockerfile
      network: host
    profiles: ["apps"]
    ports:
      - "5220:5220"
    environment:
      Ports__Http: "5220"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USER:-smartcity}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD:-smartcity}"
      FakeAi__ForceDetection: "true"
      S3__PublicBaseUrl: "http://localhost:9000"
      S3__InternalBaseUrl: "http://s3:8333"
      Seq__ServerUrl: "http://seq:5341"
    depends_on:
      rabbitmq: { condition: service_healthy }

  pothole:
    build:
      context: .
      dockerfile: src/Services/Pothole/SmartCity.Pothole.Api/Dockerfile
      network: host
    profiles: ["apps"]
    ports:
      - "5230:5230"
      - "5231:5231"
    environment:
      Ports__Http: "5230"
      Ports__Grpc: "5231"
      ConnectionStrings__Db: "Host=postgres;Port=5432;Database=pothole_db;Username=pothole_svc;Password=pothole_svc"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USER:-smartcity}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD:-smartcity}"
      Seq__ServerUrl: "http://seq:5341"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  inventory:
    build:
      context: .
      dockerfile: src/Services/Inventory/SmartCity.Inventory.Api/Dockerfile
      network: host
    profiles: ["apps"]
    ports:
      - "5240:5240"
      - "5241:5241"
    environment:
      Ports__Http: "5240"
      Ports__Grpc: "5241"
      ConnectionStrings__Db: "Host=postgres;Port=5432;Database=inventory_db;Username=inventory_svc;Password=inventory_svc"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USER:-smartcity}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD:-smartcity}"
      Seq__ServerUrl: "http://seq:5341"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  violation:
    build:
      context: .
      dockerfile: src/Services/Violation/SmartCity.Violation.Api/Dockerfile
      network: host
    profiles: ["apps"]
    ports:
      - "5250:5250"
      - "5251:5251"
    environment:
      Ports__Http: "5250"
      Ports__Grpc: "5251"
      ConnectionStrings__Db: "Host=postgres;Port=5432;Database=violation_db;Username=violation_svc;Password=violation_svc"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USER:-smartcity}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD:-smartcity}"
      Seq__ServerUrl: "http://seq:5341"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  building:
    build:
      context: .
      dockerfile: src/Services/Building/SmartCity.Building.Api/Dockerfile
      network: host
    profiles: ["apps"]
    ports:
      - "5260:5260"
      - "5261:5261"
    environment:
      Ports__Http: "5260"
      Ports__Grpc: "5261"
      ConnectionStrings__Db: "Host=postgres;Port=5432;Database=building_db;Username=building_svc;Password=building_svc"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USER:-smartcity}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD:-smartcity}"
      Seq__ServerUrl: "http://seq:5341"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  costcalculation:
    build:
      context: .
      dockerfile: src/Services/CostCalculation/SmartCity.CostCalculation.Api/Dockerfile
      network: host
    profiles: ["apps"]
    ports:
      - "5270:5270"
      - "5271:5271"
    environment:
      Ports__Http: "5270"
      Ports__Grpc: "5271"
      ConnectionStrings__Db: "Host=postgres;Port=5432;Database=costcalc_db;Username=costcalc_svc;Password=costcalc_svc"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USER:-smartcity}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD:-smartcity}"
      Seq__ServerUrl: "http://seq:5341"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  workorder:
    build:
      context: .
      dockerfile: src/Services/WorkOrder/SmartCity.WorkOrder.Api/Dockerfile
      network: host
    profiles: ["apps"]
    ports:
      - "5280:5280"
      - "5281:5281"
    environment:
      Ports__Http: "5280"
      Ports__Grpc: "5281"
      ConnectionStrings__Db: "Host=postgres;Port=5432;Database=workorder_db;Username=workorder_svc;Password=workorder_svc"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USER:-smartcity}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD:-smartcity}"
      Seq__ServerUrl: "http://seq:5341"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  notification:
    build:
      context: .
      dockerfile: src/Services/Notification/SmartCity.Notification.Api/Dockerfile
      network: host
    profiles: ["apps"]
    ports:
      - "5290:5290"
      - "5291:5291"
    environment:
      Ports__Http: "5290"
      Ports__Grpc: "5291"
      ConnectionStrings__Db: "Host=postgres;Port=5432;Database=notification_db;Username=notification_svc;Password=notification_svc"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USER:-smartcity}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD:-smartcity}"
      Seq__ServerUrl: "http://seq:5341"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

volumes:
  pgdata:
  rabbitdata:
  s3data:
  seqdata:
